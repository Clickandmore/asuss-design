<div class="as-rec" data-as-records>
  <div class="as-pagehead as-rec__head">
    <div>
      <h2 data-rec-title>السجلات</h2>
      <p data-rec-desc></p>
    </div>
    <div class="as-pagehead__actions">
      <div class="as-dd">
        <button class="as-btn as-btn--secondary" type="button" data-as-dd aria-expanded="false" aria-haspopup="true"><i class="fa-solid fa-arrow-up-from-bracket"></i>تصدير</button>
        <div class="as-dd__menu">
          <button type="button" data-export="Excel"><i class="fa-solid fa-file-excel"></i>Excel</button>
          <button type="button" data-export="PDF"><i class="fa-solid fa-file-pdf"></i>PDF</button>
          <button type="button" data-export="print"><i class="fa-solid fa-print"></i>طباعة</button>
        </div>
      </div>
      <a class="as-btn as-btn--primary" href="#" data-rec-new><i class="fa-solid fa-plus"></i><span>جديد</span></a>
    </div>
  </div>

  <nav class="as-rectabs" role="tablist" aria-label="السجلات" data-rec-tabs></nav>

  <section class="as-card as-rec__card" aria-live="polite" aria-busy="false">
    <div class="as-chips" role="group" aria-label="تصفية حسب الحالة" data-rec-chips></div>

    <div class="as-rec__bar">
      <label class="as-search as-rec__search">
        <span class="as-sr">بحث في السجلات</span>
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input type="search" data-rec-q autocomplete="off">
      </label>
      <div class="as-rec__filters" data-rec-filters></div>
      <span class="as-spacer"></span>
      <div class="as-rec__tools">
        <div class="as-seg" data-rec-view role="group" aria-label="طريقة العرض" hidden>
          <button type="button" data-view="table" aria-pressed="true" title="جدول"><i class="fa-solid fa-list"></i><span class="as-sr">جدول</span></button>
          <button type="button" data-view="cards" aria-pressed="false" title="بطاقات"><i class="fa-solid fa-grip"></i><span class="as-sr">بطاقات</span></button>
        </div>
        <div class="as-seg" data-rec-density role="group" aria-label="كثافة الصفوف">
          <button type="button" data-density="comfortable" aria-pressed="true" title="مريح"><i class="fa-solid fa-bars"></i><span class="as-sr">مريح</span></button>
          <button type="button" data-density="compact" aria-pressed="false" title="مضغوط"><i class="fa-solid fa-align-justify"></i><span class="as-sr">مضغوط</span></button>
        </div>
        <div class="as-dd">
          <button class="as-btn as-btn--secondary as-btn--icon" type="button" data-as-dd aria-expanded="false" aria-haspopup="true" title="الأعمدة"><i class="fa-solid fa-table-columns"></i><span class="as-sr">الأعمدة</span></button>
          <div class="as-dd__menu as-dd__menu--cols" data-rec-cols></div>
        </div>
      </div>
    </div>

    <div class="as-rec__pills" data-rec-pills hidden></div>

    <div class="as-rec__bulk" data-rec-bulk hidden>
      <strong><span class="as-num" data-rec-selcount>0</span> محدد</strong>
      <div class="as-rec__bulkacts" data-rec-bulkacts></div>
      <button type="button" class="as-btn as-btn--sm as-btn--ghost" data-rec-clearsel>إلغاء التحديد</button>
    </div>

    <div class="as-rec__scroll" data-rec-scroll>
      <table class="as-table as-rtable" data-rec-table><thead></thead><tbody></tbody></table>
      <div class="as-rcards" data-rec-cards hidden></div>
      <div class="as-rec__empty" data-rec-empty hidden>
        <span class="as-rec__emptyicon"><i class="fa-solid fa-magnifying-glass"></i></span>
        <strong>لا توجد سجلات مطابقة</strong>
        <p>جرّب كلمة بحث أخرى أو أزل بعض الفلاتر.</p>
        <button type="button" class="as-btn as-btn--secondary" data-rec-reset><i class="fa-solid fa-rotate-left"></i>مسح البحث والفلاتر</button>
      </div>
    </div>

    <div class="as-rec__foot">
      <span data-rec-range></span>
      <label class="as-rec__size">صفوف الصفحة
        <select class="as-select as-select--sm" data-rec-size>
          <option value="10">10</option><option value="25">25</option><option value="50">50</option><option value="100">100</option>
        </select>
      </label>
      <nav class="as-pager" aria-label="الصفحات" data-rec-pager></nav>
    </div>
  </section>
</div>

<!-- details of one record: opens from the row, ↑ ↓ move between rows, Esc closes -->
<div class="as-drawer" data-rec-drawer hidden>
  <div class="as-drawer__veil" aria-hidden="true"></div>
  <aside class="as-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="as-drawer-title">
    <header class="as-drawer__head">
      <div class="as-drawer__nav">
        <button type="button" class="as-iconbtn as-iconbtn--sm" data-drawer-prev aria-label="السجل السابق" title="السابق (↑)"><i class="fa-solid fa-chevron-up"></i></button>
        <button type="button" class="as-iconbtn as-iconbtn--sm" data-drawer-next aria-label="السجل التالي" title="التالي (↓)"><i class="fa-solid fa-chevron-down"></i></button>
        <span class="as-drawer__pos" data-drawer-pos></span>
      </div>
      <button type="button" class="as-iconbtn" data-drawer-close aria-label="إغلاق التفاصيل"><i class="fa-solid fa-xmark"></i></button>
    </header>
    <div class="as-drawer__title">
      <p data-drawer-eyebrow></p>
      <h3 id="as-drawer-title" data-drawer-title></h3>
    </div>
    <div class="as-drawer__body" data-drawer-body></div>
    <footer class="as-drawer__foot" data-drawer-foot></footer>
  </aside>
</div>
<!-- scripts -->
<script src="../assets/admin/custom/asuss-records.js"></script>
<script src="../kit/records-mock.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var R = AsRecords, esc = R.esc, M = R.mock;

  // shared option lists (in asuss: from the nationalities / employees / shelters tables)
  var NAT = M.NAT, STAFF = M.STAFF, SHELTERS = M.SHELTERS;
  function statusOf(list, id) { return list.filter(function (s) { return s.id === id; })[0] || { label: id, tone: 'neutral' }; }
  function sb(list, id) { var s = statusOf(list, id); return R.badge(s.label, s.tone); }
  function link(entity, id, label) { return '<a class="as-ref as-num" href="#' + entity + '" data-ref>' + esc(label || ('#' + id)) + '</a>'; }

  /* ---------- طلبات ---------- */
  var ORDER_ST = [
    { id: 'new', label: 'جديد', tone: 'info' }, { id: 'review', label: 'قيد المراجعة', tone: 'warning' },
    { id: 'contracted', label: 'تم التعاقد', tone: 'success' }, { id: 'rejected', label: 'مرفوض', tone: 'danger' },
    { id: 'expired', label: 'انتهت المهلة', tone: 'neutral' }
  ];
  /* ---------- عقود الاستقدام ---------- */
  var STAGES = [
    { id: 'new', label: 'عقد جديد', tone: 'info' }, { id: 'msaned', label: 'مساند', tone: 'info' },
    { id: 'tafwed', label: 'التفويض', tone: 'info' }, { id: 'taffez', label: 'التفييز', tone: 'info' },
    { id: 'tazker', label: 'التذكرة', tone: 'info' }, { id: 'arrival', label: 'الوصول', tone: 'info' },
    { id: 'warranty', label: 'تحت الضمان', tone: 'success' }, { id: 'completed', label: 'مكتمل', tone: 'neutral' },
    { id: 'back', label: 'مرتجع / ملغي', tone: 'danger' }
  ];
  var FLOW = ['new', 'msaned', 'tafwed', 'taffez', 'tazker', 'arrival', 'warranty'];
  function nextStage(s) { var i = FLOW.indexOf(s); return i >= 0 && i < FLOW.length - 1 ? statusOf(STAGES, FLOW[i + 1]) : null; }
  function segs(s) {
    var i = FLOW.indexOf(s), done = s === 'completed' ? 7 : i;
    if (s === 'back') return '<span class="as-segs as-segs--danger" aria-label="ملغي"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>';
    var out = '';
    for (var k = 0; k < 7; k++) out += '<i class="' + (k < done ? 'on' : k === done ? 'now' : '') + '"></i>';
    return '<span class="as-segs" aria-label="المرحلة ' + (Math.min(done, 6) + 1) + ' من 7">' + out + '</span>';
  }
  /* ---------- عقود التأجير ---------- */
  var RENT_ST = [
    { id: 'sent', label: 'أُرسل للتوقيع', tone: 'info' }, { id: 'signed', label: 'موقّع', tone: 'info' },
    { id: 'delivered', label: 'تم التسليم', tone: 'info' }, { id: 'trial', label: 'فترة التجربة', tone: 'warning' },
    { id: 'active', label: 'ساري', tone: 'success' }, { id: 'ended', label: 'منتهي', tone: 'neutral' }
  ];
  var PAY = { paid: ['مدفوع', 'success'], partial: ['مدفوع جزئيًا', 'warning'], unpaid: ['غير مدفوع', 'danger'] };
  /* ---------- الإيواء ---------- */
  var SHELTER_ST = [
    { id: 'in', label: 'داخل الإيواء', tone: 'info' }, { id: 'ready', label: 'جاهزة للتسليم', tone: 'success' },
    { id: 'transfer', label: 'بانتظار نقل الكفالة', tone: 'warning' }, { id: 'deport', label: 'إجراءات الترحيل', tone: 'danger' },
    { id: 'out', label: 'غادرت الإيواء', tone: 'neutral' }
  ];
  /* ---------- السير الذاتية ---------- */
  var MAID_ST = [
    { id: 'available', label: 'متاحة', tone: 'success' }, { id: 'reserved', label: 'محجوزة', tone: 'info' },
    { id: 'backout', label: 'مستبعدة', tone: 'warning' }, { id: 'suspended', label: 'موقوفة', tone: 'danger' },
    { id: 'deported', label: 'مرحّلة', tone: 'neutral' }
  ];
  function years(n) { return n === 0 ? 'بدون خبرة' : n === 1 ? 'سنة' : n === 2 ? 'سنتان' : n <= 10 ? n + ' سنوات' : n + ' سنة'; }
  /* ---------- العملاء ---------- */
  var CLIENT_ST = [{ id: 'active', label: 'مفعّل', tone: 'success' }, { id: 'blocked', label: 'محظور', tone: 'danger' }];
  /* ---------- الشكاوى ---------- */
  var COMP_ST = [
    { id: 'pending', label: 'جديدة', tone: 'danger' }, { id: 'progress', label: 'قيد المعالجة', tone: 'warning' },
    { id: 'resolved', label: 'تم الحل', tone: 'success' }, { id: 'closed', label: 'مغلقة', tone: 'neutral' }
  ];
  /* ---------- التعميدات ---------- */
  var CLAIM_ST = [
    { id: 'pending', label: 'بانتظار الاعتماد', tone: 'warning' }, { id: 'approved', label: 'معتمد', tone: 'info' },
    { id: 'paid', label: 'تم الصرف', tone: 'success' }, { id: 'rejected', label: 'مرفوض', tone: 'danger' }
  ];
  /* ---------- المهام ---------- */
  var TASK_ST = [
    { id: 'pending', label: 'لم تبدأ', tone: 'neutral' }, { id: 'progress', label: 'قيد التنفيذ', tone: 'info' },
    { id: 'done', label: 'مكتملة', tone: 'success' }
  ];

  var ENTITIES = [
    {
      id: 'orders', tab: 'الطلبات', title: 'الطلبات', one: 'الطلب', dept: 'الاستقدام', icon: 'fa-inbox', total: 64,
      desc: 'كل طلب يصل من التطبيق أو الموقع أو الفرع، من وصوله حتى يصبح عقدًا.',
      searchHint: 'رقم الطلب، اسم العميل أو العاملة',
      create: { label: 'طلب جديد', route: '/admin/orders/create' },
      statuses: ORDER_ST, sort: ['id', 'desc'],
      filters: [
        { key: 'type', label: 'النوع', all: 'كل الأنواع', options: [['rec', 'استقدام'], ['rent', 'تأجير']] },
        { key: 'nat', label: 'الجنسية', all: 'كل الجنسيات', options: NAT },
        { key: 'staff', label: 'المسؤول', all: 'كل الموظفين', options: STAFF }
      ],
      flags: [{ key: 'urgent', label: 'مهلتها أقل من 6 ساعات', icon: 'fa-stopwatch' }],
      bulk: [{ label: 'إسناد إلى موظف', icon: 'fa-user-check' }, { label: 'تصدير المحدد', icon: 'fa-file-excel' }],
      columns: [
        { key: 'ref', label: 'الطلب', fixed: true, primary: true, sort: 'id', render: function (r) { return R.two(r.ref, r.created, { num: true, subNum: true }); } },
        { key: 'client', label: 'العميل', render: function (r) { return R.person(r.client, r.phone, { subNum: true }); } },
        { key: 'type', label: 'النوع', render: function (r) { return R.tag(r.type, r.type === 'استقدام' ? 'fa-plane-arrival' : 'fa-handshake'); } },
        { key: 'maid', label: 'العاملة المطلوبة', render: function (r) { return r.maid ? R.two(r.maid, r.nat) : R.two('لم تُختر بعد', r.nat, { mainHtml: '<span class="as-none">لم تُختر بعد</span>' }); } },
        { key: 'staff', label: 'المسؤول', render: function (r) { return esc(r.staff); } },
        { key: 'timer', label: 'المهلة', render: function (r) {
          if (r.status !== 'new') return R.none();
          return '<span class="as-timer' + (r.hours < 6 ? ' is-low' : '') + '"><i class="fa-regular fa-clock"></i>باقي <span class="as-num">' + r.hours + '</span> س</span>';
        } },
        { key: 'status', label: 'الحالة', render: function (r) { return sb(ORDER_ST, r.status); } },
        { key: 'contract', label: 'العقد', render: function (r) { return r.contract ? link('recruitment', r.contract) : R.none('بدون عقد'); } },
        { key: 'channel', label: 'المصدر', hidden: true, render: function (r) { return esc(r.channel); } },
        { key: 'created', label: 'التاريخ', hidden: true, sort: 'created', render: function (r) { return R.two(R.ago(r.age), r.created, { subNum: true }); } }
      ],
      drawerTitle: function (r) { return 'طلب <span class="as-num">' + esc(r.ref) + '</span> ' + sb(ORDER_ST, r.status); },
      detail: function (r) {
        return (r.status === 'new' ? R.note('<i class="fa-regular fa-clock"></i> تنتهي مهلة الرد على هذا الطلب بعد <strong class="as-num">' + r.hours + '</strong> ساعة.', r.hours < 6 ? 'danger' : 'warning') : '') +
          R.section('العميل', '<div class="as-dperson">' + R.avatar(r.client, 'lg') + R.two(r.client, r.phone, { subNum: true }) + '</div>') +
          R.section('الطلب', R.dl([['النوع', r.type], ['العاملة المطلوبة', r.maid || 'لم تُختر بعد'], ['الجنسية', r.nat], ['المصدر', r.channel], ['المسؤول', r.staff], ['تاريخ الطلب', R.date(r.created), true], ['العقد', r.contract ? link('recruitment', r.contract) : 'بدون عقد', true]]));
      },
      actions: function (r) {
        return r.status === 'contracted' ? [{ label: 'فتح العقد', icon: 'fa-file-signature' }, { label: 'مراسلة العميل', icon: 'fa-message' }]
          : r.status === 'new' || r.status === 'review' ? [{ label: 'تحويل إلى عقد', icon: 'fa-file-signature' }, { label: 'رفض الطلب', icon: 'fa-xmark' }]
          : [{ label: 'إعادة فتح الطلب', icon: 'fa-rotate-left' }];
      }
    },
    {
      id: 'recruitment', tab: 'الاستقدام', title: 'عقود الاستقدام', one: 'عقد الاستقدام', dept: 'الاستقدام', icon: 'fa-file-signature', total: 218,
      alert: { n: 4, label: 'بانتظار الاعتماد' },
      desc: 'كل عقد في مرحلته، من التوقيع حتى انتهاء الضمان. المتأخر عن مدة المرحلة يظهر بالأحمر.',
      searchHint: 'رقم العقد، اسم العميل أو العاملة',
      create: { label: 'عقد استقدام جديد', href: 'recruitment-contract-create.html' },
      statuses: STAGES, sort: ['id', 'desc'],
      filters: [
        { key: 'nat', label: 'الجنسية', all: 'كل الجنسيات', options: NAT },
        { key: 'staff', label: 'المسوّق', all: 'كل المسوّقين', options: STAFF }
      ],
      flags: [{ key: 'late', label: 'المتأخرة', icon: 'fa-triangle-exclamation' }, { key: 'approval', label: 'بانتظار الاعتماد', icon: 'fa-stamp' }],
      bulk: [{ label: 'نقل للمرحلة التالية', icon: 'fa-arrow-left' }, { label: 'طباعة العقود', icon: 'fa-print' }, { label: 'تصدير المحدد', icon: 'fa-file-excel' }],
      columns: [
        { key: 'ref', label: 'العقد', fixed: true, primary: true, sort: 'id', render: function (r) { return R.two(r.ref, r.created, { num: true, subNum: true }); } },
        { key: 'client', label: 'العميل', sort: 'client', render: function (r) { return R.person(r.client, r.phone, { subNum: true }); } },
        { key: 'maid', label: 'العاملة', render: function (r) { return R.two(r.maid, r.nat + ' · ' + r.passport); } },
        { key: 'stage', label: 'المرحلة', sort: 'inStage', render: function (r) {
          var sub = FLOW.indexOf(r.status) >= 0 && r.status !== 'warranty'
            ? (r.late ? '<span class="as-late"><i class="fa-solid fa-circle-exclamation"></i>متأخر ' + R.days(r.lateBy) + '</span>' : 'منذ ' + R.days(r.inStage || 1))
            : r.status === 'warranty' ? 'باقي ' + R.days(r.warrantyLeft) : '';
          return '<div class="as-two">' + '<span>' + sb(STAGES, r.status) + (r.approval ? ' <span class="as-flag" title="بانتظار الاعتماد"><i class="fa-solid fa-stamp"></i></span>' : '') + '</span>' + (sub ? '<span class="as-two__sub">' + sub + '</span>' : '') + '</div>';
        } },
        { key: 'progress', label: 'التقدم', render: function (r) { return segs(r.status); } },
        { key: 'staff', label: 'المسوّق', render: function (r) { return esc(r.staff); } },
        { key: 'next', label: 'الإجراء التالي', render: function (r) {
          var n = nextStage(r.status);
          return n ? '<button type="button" class="as-btn as-btn--sm as-btn--soft" data-rec-act="نقل إلى ' + n.label + '">نقل إلى ' + esc(n.label) + '<i class="fa-solid fa-arrow-left"></i></button>' : R.none();
        } },
        { key: 'numbers', label: 'مساند / التأشيرة', hidden: true, render: function (r) { return R.two(r.msaned || '—', r.visa || '—', { num: true, subNum: true }); } },
        { key: 'price', label: 'قيمة العقد', num: true, hidden: true, render: function (r) { return R.money(r.price); } }
      ],
      drawerTitle: function (r) { return 'عقد <span class="as-num">' + esc(r.ref) + '</span> ' + sb(STAGES, r.status); },
      detail: function (r) {
        var i = r.status === 'completed' ? 7 : FLOW.indexOf(r.status);
        var steps = FLOW.map(function (id, k) {
          var s = statusOf(STAGES, id);
          return { label: s.label, note: k < i ? 'تم' : k === i ? (r.late ? '<span class="as-late">متأخر ' + R.days(r.lateBy) + '</span>' : id === 'warranty' ? 'باقي ' + R.days(r.warrantyLeft) : 'منذ ' + R.days(r.inStage || 1)) : '' };
        });
        var left = r.price - r.paid;
        return (r.late ? R.note('<i class="fa-solid fa-circle-exclamation"></i> هذا العقد تجاوز مدة مرحلة «' + statusOf(STAGES, r.status).label + '» بـ ' + R.days(r.lateBy) + '.', 'danger') : '') +
          (r.approval ? R.note('<i class="fa-solid fa-stamp"></i> العقد بانتظار اعتمادك قبل الانتقال إلى مساند.', 'warning') : '') +
          (r.status === 'back' ? R.note('<i class="fa-solid fa-ban"></i> العقد مرتجع أو ملغي.', 'danger') : R.section('مراحل العقد', R.steps(steps, i, { danger: r.late }))) +
          R.section('الأطراف', '<div class="as-dpair"><div class="as-dperson">' + R.avatar(r.client, 'lg') + R.two(r.client, r.phone, { subNum: true }) + '</div><div class="as-dperson">' + R.avatar(r.maid, 'lg') + R.two(r.maid, r.nat) + '</div></div>') +
          R.section('بيانات العقد', R.dl([['رقم مساند', r.msaned ? '<span class="as-num">' + r.msaned + '</span>' : '', true], ['رقم التأشيرة', r.visa ? '<span class="as-num">' + r.visa + '</span>' : '', true], ['جواز العاملة', '<span class="as-num">' + r.passport + '</span>', true], ['المكتب الخارجي', r.office], ['المسوّق', r.staff], ['تاريخ العقد', R.date(r.created), true]])) +
          R.section('المالية', '<div class="as-dmoney"><div><span>قيمة العقد</span>' + R.money(r.price) + '</div><div><span>المدفوع</span>' + R.money(r.paid) + '</div><div><span>المتبقي</span>' + (left ? R.money(left) : '<span class="as-ok"><i class="fa-solid fa-check"></i> مسدد</span>') + '</div></div>' + R.bar(r.paid, r.price, left ? '' : 'success'));
      },
      actions: function (r) {
        var n = nextStage(r.status), out = [];
        if (r.approval) out.push({ label: 'اعتماد العقد', icon: 'fa-stamp' });
        else if (n) out.push({ label: 'نقل إلى ' + n.label, icon: 'fa-arrow-left' });
        out.push({ label: 'طباعة العقد', icon: 'fa-print' }, { label: 'الملف الكامل', icon: 'fa-up-right-from-square' });
        return out;
      },
      more: [{ label: 'تعديل', icon: 'fa-pen' }, { label: 'إلغاء العقد', icon: 'fa-ban', danger: true, sep: true }]
    },
    {

      desc: 'عقود تأجير العاملات: التوقيع والتسليم وفترة التجربة والمدة المتبقية والدفع.',

        { key: 'status', label: 'الحالة', render: function (r) { return sb(COMP_ST, r.status); } },
        { key: 'channel', label: 'القناة', hidden: true, render: function (r) { return esc(r.channel); } }
      ],
      drawerTitle: function (r) { return 'شكوى <span class="as-num">' + esc(r.ref) + '</span> ' + sb(COMP_ST, r.status); },
      detail: function (r) {
        var order = ['pending', 'progress', 'resolved', 'closed'], i = order.indexOf(r.status);
        return (r.noContact ? R.note('<i class="fa-solid fa-phone-slash"></i> مضى ' + R.days(r.age) + ' ولم يُتواصل مع العميل بعد.', 'danger') : '') +
          R.section('نص الشكوى', '<blockquote class="as-quote">' + esc(r.text) + '</blockquote>') +
          R.section('المتابعة', R.steps([{ label: 'استُلمت', note: r.created }, { label: 'قيد المعالجة' }, { label: 'تم الحل' }, { label: 'أُغلقت' }], i, { danger: r.noContact })) +
          R.section('التفاصيل', R.dl([['العميل', r.client], ['الجوال', '<span class="as-num">' + r.phone + '</span>', true], ['الموضوع', r.type], ['العقد', r.contract ? link('recruitment', r.contract) : 'بدون عقد', true], ['الأولوية', R.dots(r.prio), true], ['المسؤول', r.staff || 'غير مُسندة'], ['القناة', r.channel]]));
      },
      actions: function (r) {
        return r.status === 'closed' || r.status === 'resolved' ? [{ label: 'إعادة فتح', icon: 'fa-rotate-left' }]
          : [{ label: 'الرد على الشكوى', icon: 'fa-reply' }, { label: r.staff ? 'تغيير المسؤول' : 'إسناد', icon: 'fa-user-check' }, { label: 'إغلاق', icon: 'fa-circle-check' }];
      }
    },
    {
      id: 'claims', tab: 'التعميدات', title: 'التعميدات المالية', one: 'التعميد', dept: 'المالية', icon: 'fa-money-check-dollar', total: 60,
      alert: { n: 9, label: 'بانتظار الاعتماد' },
      desc: 'طلبات الصرف: الرسوم الحكومية والمكاتب الخارجية والتذاكر والاسترجاع، ومن يعتمدها.',
      searchHint: 'رقم التعميد، العميل أو الجهة',
      create: { label: 'تعميد جديد', route: '/admin/finance-claims/create' },
      statuses: CLAIM_ST, sort: ['id', 'desc'],
      filters: [
        { key: 'type', label: 'النوع', all: 'كل الأنواع', options: [['gov', 'رسوم حكومية'], ['office', 'مكتب خارجي'], ['ticket', 'تذكرة طيران'], ['refund', 'استرجاع عميل'], ['medical', 'فحص طبي']] },
        { key: 'by', label: 'طالب التعميد', all: 'كل الموظفين', options: STAFF }
      ],
      flags: [{ key: 'big', label: '5,000 ر.س فأكثر', icon: 'fa-coins' }],
      bulk: [{ label: 'اعتماد المحدد', icon: 'fa-check' }, { label: 'تصدير المحدد', icon: 'fa-file-excel' }],
      columns: [
        { key: 'ref', label: 'التعميد', fixed: true, primary: true, sort: 'id', render: function (r) { return R.two(r.ref, r.created, { num: true, subNum: true }); } },
        { key: 'type', label: 'النوع والجهة', render: function (r) { return R.two(r.type, r.benef); } },
        { key: 'client', label: 'العميل / العقد', render: function (r) { return R.two(r.client, 'عقد #' + r.contract); } },
        { key: 'amount', label: 'المبلغ', num: true, sort: 'amount', render: function (r) { return '<strong>' + R.money(r.amount) + '</strong>'; } },
        { key: 'by', label: 'طالب التعميد', render: function (r) { return esc(r.by); } },
        { key: 'stuck', label: 'متوقف عند', render: function (r) { return r.stuck ? '<span class="as-wait"><i class="fa-regular fa-hourglass-half"></i>' + esc(r.stuck) + '</span>' : R.none(); } },
        { key: 'status', label: 'الحالة', render: function (r) { return sb(CLAIM_ST, r.status); } }
      ],
      drawerTitle: function (r) { return 'تعميد <span class="as-num">' + esc(r.ref) + '</span> ' + sb(CLAIM_ST, r.status); },
      detail: function (r) {
        var i = { pending: 1, approved: 3, paid: 4, rejected: 1 }[r.status];
        return '<div class="as-damount"><span>المبلغ</span>' + R.money(r.amount) + '<small>' + esc(r.type) + ' · ' + esc(r.benef) + '</small></div>' +
          R.section('الاعتماد', R.steps([{ label: 'طلب التعميد', note: esc(r.by) }, { label: 'اعتماد مدير الفرع' }, { label: 'اعتماد المدير المالي' }, { label: 'الصرف' }], i, { danger: r.status === 'rejected' })) +
          R.section('التفاصيل', R.dl([['العميل', r.client], ['العقد', link('recruitment', r.contract), true], ['تاريخ الطلب', R.date(r.created), true], ['متوقف عند', r.stuck || '—']]));
      },
      actions: function (r) {
        return r.status === 'pending' ? [{ label: 'اعتماد', icon: 'fa-check' }, { label: 'رفض', icon: 'fa-xmark' }, { label: 'طباعة', icon: 'fa-print' }]
          : r.status === 'approved' ? [{ label: 'تسجيل الصرف', icon: 'fa-money-bill-transfer' }, { label: 'طباعة', icon: 'fa-print' }]
          : [{ label: 'طباعة السند', icon: 'fa-print' }];
      }
    },
    {
      id: 'tasks', tab: 'المهام', title: 'المهام', one: 'المهمة', dept: 'الرئيسية', icon: 'fa-list-check', total: 22,
      desc: 'مهام فريق العمل ومواعيدها. المتأخرة تظهر بالأحمر.',
      searchHint: 'عنوان المهمة أو اسم الموظف',
      create: { label: 'مهمة جديدة', route: '/admin/tasks/create' },
      statuses: TASK_ST, sort: ['due', 'asc'],
      filters: [
        { key: 'to', label: 'المكلّف', all: 'كل الموظفين', options: STAFF },
        { key: 'prio', label: 'الأولوية', all: 'كل الأولويات', options: [['high', 'عالية'], ['medium', 'متوسطة'], ['low', 'منخفضة']] }
      ],
      flags: [{ key: 'mine', label: 'مهامي', icon: 'fa-user' }, { key: 'late', label: 'المتأخرة', icon: 'fa-triangle-exclamation' }],
      bulk: [{ label: 'تم الإنجاز', icon: 'fa-check' }, { label: 'إعادة إسناد', icon: 'fa-user-check' }],
      columns: [
        { key: 'title', label: 'المهمة', fixed: true, primary: true, sort: 'id', render: function (r) { return R.two(r.title, r.ref, { subNum: true }); } },
        { key: 'prio', label: 'الأولوية', sort: 'prio', render: function (r) { return R.dots(r.prio); } },
        { key: 'to', label: 'المكلّف', render: function (r) { return R.person(r.to, ''); } },
        { key: 'by', label: 'أنشأها', render: function (r) { return esc(r.by); } },
        { key: 'due', label: 'الاستحقاق', sort: 'due', render: function (r) {
          var sub = r.status === 'done' ? 'أُنجزت' : r.late ? '<span class="as-late">متأخرة ' + R.days(-r.dueIn) + '</span>' : r.dueIn === 0 ? 'اليوم' : 'باقي ' + R.days(r.dueIn);
          return R.two(r.due, '', { num: true, subHtml: sub });
        } },
        { key: 'status', label: 'الحالة', render: function (r) { return sb(TASK_ST, r.status); } }
      ],
      drawerTitle: function (r) { return esc(r.title) + ' ' + sb(TASK_ST, r.status); },
      detail: function (r) {
        return (r.late ? R.note('<i class="fa-solid fa-circle-exclamation"></i> تجاوزت المهمة موعدها بـ ' + R.days(-r.dueIn) + '.', 'danger') : '') +
          R.section('المهمة', R.dl([['المكلّف', r.to], ['أنشأها', r.by], ['الأولوية', R.dots(r.prio), true], ['الاستحقاق', R.date(r.due), true], ['أُنشئت', R.date(r.created), true]])) +
          R.section('المتابعة', R.steps([{ label: 'لم تبدأ' }, { label: 'قيد التنفيذ' }, { label: 'مكتملة' }], { pending: 0, progress: 1, done: 2 }[r.status] + (r.status === 'done' ? 1 : 0), { danger: r.late }));
      },
      actions: function (r) {
        return r.status === 'done' ? [{ label: 'إعادة فتح', icon: 'fa-rotate-left' }]
          : [{ label: r.status === 'pending' ? 'بدء التنفيذ' : 'تم الإنجاز', icon: r.status === 'pending' ? 'fa-play' : 'fa-check' }, { label: 'إضافة تعليق', icon: 'fa-comment' }];
      }
    }
  ];

  R.init({ entities: ENTITIES, default: 'recruitment' });
});
</script>
