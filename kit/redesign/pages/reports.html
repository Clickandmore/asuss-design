<div class="as-pagehead">
  <div>
    <h2>التقارير</h2>
    <p>اختر تقريرًا من القائمة، وحدّد الفترة والفرع، ثم صدّره إن احتجت.</p>
  </div>
</div>

<div class="as-card as-filters as-reportbar">
  <div class="as-seg" role="group" aria-label="الفترة" id="as-period">
    <button type="button" aria-pressed="true" data-period="month">هذا الشهر</button>
    <button type="button" aria-pressed="false" data-period="quarter">آخر 3 أشهر</button>
    <button type="button" aria-pressed="false" data-period="year">آخر 12 شهرًا</button>
  </div>
  <label><span class="as-sr">الفرع</span>
    <select class="as-select">
      <option>كل الفروع</option>
      <option>الفرع الرئيسي</option>
      <option>فرع 2</option>
    </select>
  </label>
  <label class="as-reportbar__pick"><span class="as-sr">التقرير</span>
    <select class="as-select" id="as-report-pick"></select>
  </label>
  <span class="as-spacer"></span>
  <button class="as-btn as-btn--secondary" type="button" data-export="Excel"><i class="fa-regular fa-file-excel"></i>Excel</button>
  <button class="as-btn as-btn--secondary" type="button" data-export="PDF"><i class="fa-regular fa-file-pdf"></i>PDF</button>
  <button class="as-btn as-btn--secondary" type="button" onclick="window.print()"><i class="fa-solid fa-print"></i>طباعة</button>
</div>

<div class="as-grid as-grid--reports as-section">
  <nav class="as-card as-reportnav" aria-label="قائمة التقارير" id="as-report-nav"></nav>
  <div class="as-stack" id="as-report"></div>
</div>
<!-- scripts -->
<script>
(function () {
  var F = AsUI.fmt;
  var MONTHS = ['ديسمبر 2025', 'يناير 2026', 'فبراير 2026', 'مارس 2026', 'أبريل 2026', 'مايو 2026', 'يونيو 2026', 'يوليو 2026', 'أغسطس 2026', 'سبتمبر 2026', 'أكتوبر 2026', 'نوفمبر 2026'];
  var SHORT = ['ديس', 'ينا', 'فبر', 'مار', 'أبر', 'ماي', 'يون', 'يول', 'أغس', 'سبت', 'أكت', 'نوف'];
  var C1 = '#1D70B7', C2 = '#00AC9A';

  var GROUPS = [
    { id: 'rec', name: 'الاستقدام', icon: 'fa-file-signature' },
    { id: 'rent', name: 'التأجير ونقل الكفالة', icon: 'fa-handshake' },
    { id: 'fin', name: 'المالية', icon: 'fa-building-columns' },
    { id: 'care', name: 'خدمة العملاء', icon: 'fa-headset' },
    { id: 'staff', name: 'الموظفون', icon: 'fa-id-badge' }
  ];

  var R = [
    { id: 'stages', group: 'rec', title: 'العقود حسب المرحلة', desc: 'أين تقف العقود الجارية، وكم منها متأخر.',
      kpis: [['عقود جارية', '34'], ['متأخرة', '4', 'danger'], ['متوسط مدة الاستقدام', '47 يومًا'], ['اكتملت هذا الشهر', '6']],
      chart: { kind: 'meters', title: 'العقود الجارية في كل مرحلة', items: [['جديد', 6], ['مساند', 9], ['التفويض', 7], ['التفييز', 5], ['التذكرة', 4], ['الوصول', 3]] },
      table: { cols: ['المرحلة', '#العقود', '#المتأخرة', '#متوسط الأيام في المرحلة'],
        rows: [['جديد', 6, 0, 3], ['مساند', 9, 1, 6], ['التفويض', 7, 3, 11], ['التفييز', 5, 0, 9], ['التذكرة', 4, 0, 8], ['الوصول', 3, 0, 10]], total: true } },

    { id: 'monthly', group: 'rec', title: 'العقود الشهرية', desc: 'العقود الجديدة مقابل المكتملة في كل شهر.',
      kpis: [['عقود جديدة', '230'], ['عقود مكتملة', '130'], ['متوسط شهري', '19'], ['نسبة الإنجاز', '57%']],
      chart: { kind: 'columns', title: 'العقود الشهرية', series: [
        { name: 'عقود جديدة', color: C1, values: [14, 18, 22, 19, 25, 17, 21, 23, 16, 19, 16, 20] },
        { name: 'عقود مكتملة', color: C2, values: [9, 12, 15, 14, 11, 13, 10, 12, 9, 11, 8, 6] }] } },

    { id: 'nationalities', group: 'rec', title: 'الجنسيات', desc: 'السير الذاتية والعقود حسب الجنسية.',
      kpis: [['سير ذاتية', '820'], ['متاحة', '578'], ['محجوزة', '242'], ['جنسيات', '5']],
      chart: { kind: 'meters', title: 'السير الذاتية حسب الجنسية', total: 795, items: [['إثيوبيا', 530], ['كينيا', 112], ['الفلبين', 70], ['أوغندا', 64], ['بنجلاديش', 19]] },
      table: { cols: ['الجنسية', '#السير', '#المتاحة', '#المحجوزة', '#عقود السنة'],
        rows: [['إثيوبيا', 530, 371, 159, 121], ['كينيا', 112, 80, 32, 44], ['الفلبين', 70, 49, 21, 38], ['أوغندا', 64, 47, 17, 19], ['بنجلاديش', 19, 15, 4, 8]], total: true } },

    { id: 'rent', group: 'rent', title: 'عقود التأجير', desc: 'العقود النشطة والجديدة والمنتهية وقيمتها.',
      kpis: [['نشطة', '22'], ['جديدة هذا الشهر', '4'], ['تنتهي خلال 30 يومًا', '3', 'warning'], ['القيمة المفعّلة', '127,148 ر.س']],
      chart: { kind: 'columns', title: 'عقود التأجير الجديدة شهريًا', series: [{ name: 'عقود جديدة', color: C1, values: [3, 2, 4, 5, 3, 2, 4, 3, 5, 2, 3, 4] }] },
      table: { cols: ['الحالة', '#العقود', '#القيمة (ر.س)'], rows: [['جديدة', 4, 23120], ['نشطة', 22, 127148], ['تم النقل', 6, 34200], ['مكتملة', 41, 236900], ['ملغية', 3, 0]], total: true } },

    { id: 'transfer', group: 'rent', title: 'نقل الكفالة', desc: 'طلبات النقل ونتيجة فترة التجربة.',
      kpis: [['طلبات مفتوحة', '9'], ['في التجربة', '5'], ['تم النقل', '17'], ['فشل التجربة', '2', 'danger']],
      chart: { kind: 'meters', title: 'طلبات نقل الكفالة حسب الحالة', items: [['طلب جديد', 4], ['في التجربة', 5], ['تم النقل', 17], ['فشل التجربة', 2]] },
      table: { cols: ['الحالة', '#الطلبات', '#متوسط الأيام'], rows: [['طلب جديد', 4, 2], ['في التجربة', 5, 9], ['تم النقل', 17, 21], ['فشل التجربة', 2, 12]], total: true } },

    { id: 'collections', group: 'fin', title: 'التحصيل الشهري', desc: 'المبالغ المحصّلة من العقود في كل شهر.',
      kpis: [['تحصيل هذا الشهر', '250,000 ر.س'], ['الشهر الماضي', '217,400 ر.س'], ['النمو', '15%', 'success'], ['مستحقات متأخرة', '38,600 ر.س', 'danger']],
      chart: { kind: 'columns', title: 'التحصيل الشهري (ألف ر.س)', unit: ' ألف', series: [{ name: 'التحصيل (ألف ر.س)', color: C1, values: [168, 182, 205, 190, 231, 176, 198, 214, 187, 202, 217, 250] }] } },

    { id: 'claims', group: 'fin', title: 'التعميدات المالية', desc: 'التعميدات حسب النوع ومبالغها.',
      kpis: [['تعميدات الشهر', '64'], ['بانتظار الاعتماد', '9', 'warning'], ['معتمدة', '55'], ['إجمالي المبالغ', '412,300 ر.س']],
      chart: { kind: 'meters', title: 'مبالغ التعميدات حسب النوع (ر.س)', items: [['رسوم حكومية', 158000], ['خارجية', 96400], ['حجوزات الطيران', 71200], ['المستشفيات', 38500], ['عملاء', 29700], ['عامة', 18500]] },
      table: { cols: ['النوع', '#العدد', '#المبلغ (ر.س)'], rows: [['رسوم حكومية', 21, 158000], ['خارجية', 12, 96400], ['حجوزات الطيران', 11, 71200], ['المستشفيات', 8, 38500], ['عملاء', 7, 29700], ['عامة', 5, 18500]], total: true } },

    { id: 'complaints', group: 'care', title: 'الشكاوى', desc: 'الشكاوى المفتوحة والمغلقة وسرعة الإغلاق.',
      kpis: [['مفتوحة', '5', 'warning'], ['أُغلقت هذا الشهر', '18'], ['متوسط الإغلاق', '2.4 يوم'], ['بلا مسؤول', '2', 'danger']],
      chart: { kind: 'meters', title: 'الشكاوى حسب النوع', items: [['تأخر الوصول', 9], ['سلوك العاملة', 6], ['طلب استبدال', 4], ['مالية', 3], ['أخرى', 1]] },
      table: { cols: ['النوع', '#مفتوحة', '#مغلقة', '#متوسط الإغلاق (يوم)'], rows: [['تأخر الوصول', 2, 7, 3.1], ['سلوك العاملة', 1, 5, 2.2], ['طلب استبدال', 1, 3, 2.8], ['مالية', 1, 2, 1.5], ['أخرى', 0, 1, 1]], total: false } },

    { id: 'staff', group: 'staff', title: 'أداء الموظفين', desc: 'العقود والتحصيل والمهام لكل موظف هذا الشهر.',
      kpis: [['موظفون نشطون', '39'], ['عقود هذا الشهر', '20'], ['مهام منجزة', '146'], ['مهام متأخرة', '7', 'danger']],
      chart: { kind: 'meters', title: 'العقود لكل موظف هذا الشهر', items: [['موظف 1', 6], ['موظف 2', 5], ['موظف 3', 4], ['موظف 4', 3], ['موظف 5', 2]] },
      table: { cols: ['الموظف', '#العقود', '#التحصيل (ر.س)', '#مهام منجزة', '#مهام متأخرة'],
        rows: [['موظف 1', 6, 74200, 31, 0], ['موظف 2', 5, 61800, 28, 1], ['موظف 3', 4, 50400, 24, 2], ['موظف 4', 3, 38900, 35, 0], ['موظف 5', 2, 24700, 28, 4]], total: true } }
  ];
  var byId = {}; R.forEach(function (r) { byId[r.id] = r; });

  // catalog (side list) + compact picker for small screens
  var nav = document.getElementById('as-report-nav');
  var pick = document.getElementById('as-report-pick');
  nav.innerHTML = GROUPS.map(function (g) {
    return '<div class="as-catalog__group"><h3><i class="fa-solid ' + g.icon + '" aria-hidden="true"></i>' + g.name + '</h3><ul class="as-catalog__list">' +
      R.filter(function (r) { return r.group === g.id; }).map(function (r) {
        return '<li><a href="#' + r.id + '" data-report="' + r.id + '" data-as-keep><span><strong>' + r.title + '</strong><span>' + r.desc + '</span></span></a></li>';
      }).join('') + '</ul></div>';
  }).join('');
  pick.innerHTML = GROUPS.map(function (g) {
    return '<optgroup label="' + g.name + '">' + R.filter(function (r) { return r.group === g.id; }).map(function (r) {
      return '<option value="' + r.id + '">' + r.title + '</option>';
    }).join('') + '</optgroup>';
  }).join('');
  pick.addEventListener('change', function () { location.hash = pick.value; });

  var host = document.getElementById('as-report');
  var current;

  function cell(v, num) { return num ? '<td class="is-num as-num">' + F(v) + '</td>' : '<td>' + v + '</td>'; }

  function render(id) {
    var r = byId[id] || R[0];
    current = r;
    nav.querySelectorAll('[data-report]').forEach(function (a) {
      var on = a.dataset.report === r.id;
      a.classList.toggle('is-active', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    pick.value = r.id;
    var group = GROUPS.filter(function (g) { return g.id === r.group; })[0];

    var kpis = '<div class="as-grid as-grid--kpi">' + r.kpis.map(function (k) {
      var tone = k[2] ? ' as-kpi__value--' + k[2] : '';
      return '<div class="as-card as-kpi"><span class="as-kpi__label">' + k[0] + '</span><div class="as-kpi__value as-kpi__value--md' + tone + '"><span class="as-num">' + k[1] + '</span></div></div>';
    }).join('') + '</div>';

    var multi = r.chart.kind === 'columns' && r.chart.series.length > 1;
    var chart = '<section class="as-card as-chartbox"><div class="as-card__head"><div><h3>' + r.chart.title + '</h3>' +
      (r.chart.kind === 'columns' ? '<p>آخر 12 شهرًا</p>' : '') + '</div>' +
      '<div class="as-seg" role="group" aria-label="طريقة العرض"><button type="button" data-as-view="chart" aria-pressed="true">رسم</button><button type="button" data-as-view="table" aria-pressed="false">جدول</button></div></div>' +
      '<div class="as-card__body">' + (multi ? '<div class="as-rlegend" style="margin-bottom:12px"></div>' : '') +
      '<div class="as-rchart as-chart"></div><div class="as-chart-table"></div></div></section>';

    var table = '';
    if (r.table) {
      var t = r.table;
      var head = t.cols.map(function (c) { return c[0] === '#' ? '<th class="is-num">' + c.slice(1) + '</th>' : '<th>' + c + '</th>'; }).join('');
      var body = t.rows.map(function (row) { return '<tr>' + row.map(function (v, i) { return cell(v, t.cols[i][0] === '#'); }).join('') + '</tr>'; }).join('');
      var foot = '';
      if (t.total) {
        foot = '<tfoot><tr>' + t.cols.map(function (c, i) {
          if (i === 0) return '<td>الإجمالي</td>';
          var sum = t.rows.reduce(function (a, row) { return a + row[i]; }, 0);
          return /متوسط/.test(c) ? '<td class="is-num">—</td>' : '<td class="is-num as-num">' + F(sum) + '</td>';
        }).join('') + '</tr></tfoot>';
      }
      table = '<section class="as-card"><div class="as-card__head"><div><h3>التفاصيل</h3></div></div><div class="as-tablewrap"><table class="as-table"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody>' + foot + '</table></div></section>';
    }

    host.innerHTML = '<div class="as-reporthead"><span class="as-badge as-badge--info">' + group.name + '</span><h3>' + r.title + '</h3><p>' + r.desc + '</p></div>' + kpis + chart + table;

    var chartEl = host.querySelector('.as-rchart'), tableEl = host.querySelector('.as-chart-table');
    if (r.chart.kind === 'columns') {
      var opts = { labels: MONTHS, short: SHORT, series: r.chart.series, unit: r.chart.unit, title: r.chart.title };
      AsUI.columns(chartEl, opts);
      if (multi) AsUI.legend(host.querySelector('.as-rlegend'), r.chart.series);
      AsUI.chartTable(tableEl, opts);
    } else {
      var items = r.chart.items.map(function (x) { return { label: x[0], value: x[1] }; });
      var ul = document.createElement('ul'); chartEl.appendChild(ul);
      AsUI.meters(ul, items, r.chart.total || items.reduce(function (a, x) { return a + x.value; }, 0));
      AsUI.chartTable(tableEl, { labelHead: 'البند', labels: items.map(function (x) { return x.label; }), series: [{ name: 'القيمة', values: items.map(function (x) { return x.value; }) }] });
    }
  }

  function fromHash() { render(location.hash.slice(1)); }
  window.addEventListener('hashchange', function () { fromHash(); window.scrollTo({ top: 0 }); });
  fromHash();

  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { render(current.id); }, 200); });

  document.getElementById('as-period').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    AsUI.toast('في الكيت تبقى الأرقام نفسها؛ في النظام تُعاد حسب الفترة: ' + b.textContent);
  });
  document.querySelectorAll('[data-export]').forEach(function (b) {
    b.addEventListener('click', function () { AsUI.toast('تصدير «' + current.title + '» إلى ' + b.dataset.export + ' يعمل في النظام، لا في الكيت'); });
  });
})();
</script>
